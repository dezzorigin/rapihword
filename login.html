<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk — RapihWord</title>
  <meta name="description" content="Masuk ke RapihWord untuk merapikan format makalah dan skripsi Word (.docx) Anda.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span>RapihWord</span>
      </a>
      <div class="topbar-actions">
        <a class="btn btn-outline btn-sm" href="/register.html">Daftar</a>
      </div>
    </div>
  </header>

  <main>
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Masuk ke RapihWord</h1>
        <p class="auth-sub">Lanjutkan merapikan dokumen Anda.</p>
        <div class="form-alert" role="alert"></div>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="login-password">Kata sandi</label>
            <input type="password" id="login-password" name="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Masuk</button>
        </form>
        <p class="auth-alt"><a href="/forgot-password.html">Lupa password?</a></p>
        <div class="auth-divider" aria-hidden="true">atau</div>
        <button type="button" id="login-google" class="btn btn-outline btn-block">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          Lanjutkan dengan Google
        </button>
        <p class="auth-alt">Belum punya akun? <a href="/register.html">Daftar sekarang</a></p>
      </div>
    </div>
  </main>

  <script src="/js/toast.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    (function () {
      'use strict';
      if (window.RMAuth && RMAuth.current()) {
        window.location.replace('/app/');
        return;
      }
      var form = document.getElementById('login-form');
      var alertBox = document.querySelector('.form-alert');
      var emailInput = document.getElementById('login-email');
      var passwordInput = document.getElementById('login-password');

      function showAlert(msg, kind) {
        alertBox.textContent = msg;
        alertBox.className = 'form-alert show ' + (kind || 'error');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = emailInput.value.trim();
        var password = passwordInput.value;
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
          showAlert('Format email tidak valid.', 'error');
          emailInput.focus();
          return;
        }
        if (!password) {
          showAlert('Kata sandi wajib diisi.', 'error');
          passwordInput.focus();
          return;
        }
        var btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        RMAuth.login(email, password).then(function (res) {
          btn.disabled = false;
          if (!res.ok) {
            showAlert(res.error || 'Gagal masuk. Coba lagi.', 'error');
            return;
          }
          window.location.href = '/app/';
        });
      });

      document.getElementById('login-google').addEventListener('click', function () {
        var btn = this;
        btn.disabled = true;
        RMAuth.loginDemo().then(function () {
          if (window.RMToast) {
            RMToast('Masuk sebagai akun demo — login Google tidak tersedia di clone statis.');
          }
          window.setTimeout(function () { window.location.href = '/app/'; }, 900);
        });
      });
    })();
  </script>
</body>
</html>
